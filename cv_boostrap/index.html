<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CV Cá Nhân (Bootstrap) - Phan Nhật Quý</title>
  <!-- Nhúng CSS Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light py-4">

  <!-- Tầng 1: Khung giấy CV căn giữa màn hình -->
  <div class="container shadow bg-white rounded-3 overflow-hidden" style="max-width: 950px;">
    
    <!-- Tầng 2: Hàng ngang chia 12 cột (5 cột trái + 7 cột phải) -->
    <div class="row">
      
      <!-- CỘT TRÁI (5/12 cột ~ 42%) -->
      <div class="col-md-5 bg-dark text-white p-4">
        <div class="text-center mb-4">
          <img src="avatar.jpg" alt="Avatar" class="rounded-circle border border-3 border-info object-fit-cover" width="150" height="150">
        </div>
        <h5 class="text-info border-bottom border-secondary pb-2">GIỚI THIỆU BẢN THÂN</h5>
        <p class="small">Sinh viên ngành CNTT (MSSV: 52.01.104.086) - ĐH Sư phạm TP.HCM.</p>
      </div>

      <!-- CỘT PHẢI (7/12 cột ~ 58%) -->
      <div class="col-md-7 p-4">
        <div class="border-bottom border-3 border-dark pb-3 mb-4">
          <h1 class="fw-bold text-dark mb-1">PHAN NHẬT QUÝ</h1>
          <p class="text-primary fw-semibold mb-0">VỊ TRÍ: LẬP TRÌNH VIÊN FRONTEND WEB</p>
        </div>
        <h4 class="bg-light p-2 border-start border-4 border-primary">HỌC VẤN</h4>
        <p><span class="badge bg-primary">2024 – Hiện tại</span> Đại học Sư phạm TP. Hồ Chí Minh</p>
      </div>

    </div>
  </div>

  <!-- Nhúng JS Bootstrap 5 -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
