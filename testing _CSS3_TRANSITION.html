<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found</title>
    <style>
        .box {
            border-style: solid;
            border-width: 1px;
            display: block; 
            width: 100px;
            height: 100px;
            background-color: #0000ff;
            /* Thêm margin để lúc xoay 180 độ góc hộp không bị chạm sát mép trái màn hình */
            margin: 60px;
            /* Đổi transform thành rotate để hiệu ứng xoay mượt trong 2s */
            transition: width 2s, height 2s, background-color 2s, rotate 2s;
        }

            .box:hover {
                background-color: #ffcccc;
                width: 200px;
                height: 200px;
                rotate: 180deg;
            }
    </style>
</head>
<body>
    <h1>404 - Page Not Found</h1>
    <p>The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>

    <!-- Rê chuột vào ô vuông này để xem hiệu ứng -->
    <div class="box"></div>
</body>
</html>
