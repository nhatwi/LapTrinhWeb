<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3.8 bài 1 sgk/141</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <!-- khung chính có viền bọc sản phẩm-->
    <div class="product-box">
        <div class="sale-tag">-10%</div>
        <div class="product-name">Product Name</div>
        <img src="images/product.png" alt="Product Image" class="product-img"/>
        <!--hàng đáy bọc chung 2 khối con để bật display:flex-->
        <div class="product-bottom">
            <!--Khối giá-->
            <div class="product-price">
                <img src="images/dollar.png" alt="Dollar Sign" />
                <span>100</span>
            </div>
            <!--Khối 2: 3 icons-->
            <div class="product-icons">
                <img src="images/letter.jpg" alt="Letter Icon" />
                <img src="images/star.png" alt="Star Icon" />
                <img src="images/shoppingcart.jpg" alt="Shopping Cart Icon" />
            </div>
        </div>
    </div>

</body>
</html>
